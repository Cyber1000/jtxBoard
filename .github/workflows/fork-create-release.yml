name: Fork - Create release

on:
  push:
    tags:
      - "v*"
      - "!v*alpha*"
      - "!v*beta*"
      - "!v*-fork"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g., v2.14.1)"
        required: true
        type: string

jobs:
  build-fork-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "fork_tag=${TAG_NAME}-fork" >> $GITHUB_OUTPUT

      - name: Check out the fork
        uses: actions/checkout@v5
        with:
          ref: develop-fork
          fetch-depth: 0
          # The fork tag carries upstream's workflow files, which GITHUB_TOKEN may never
          # create or update - no permissions: setting lifts that. The push needs the PAT.
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Put the fork commits on top of the upstream tag
        run: |
          git fetch origin --tags --force
          git fetch origin +refs/heads/develop:refs/remotes/origin/develop

          if ! git rev-parse -q --verify "${{ steps.tag.outputs.tag_name }}^{commit}" >/dev/null; then
            echo "Tag ${{ steps.tag.outputs.tag_name }} does not exist here."
            echo "Upstream tags arrive through the nightly sync - it may not have run yet."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Merging the tag into develop-fork would be a no-op: the nightly sync rebases
          # develop-fork onto develop, so every released tag is already an ancestor, and the
          # build would be current develop under a release name. Replay the fork's own commits
          # onto the tag instead.
          base=$(git merge-base origin/develop HEAD)
          if ! git rebase --onto "${{ steps.tag.outputs.tag_name }}" "$base" develop-fork; then
            git rebase --abort || true
            echo "The fork commits do not apply onto ${{ steps.tag.outputs.tag_name }}."
            exit 1
          fi

          echo "Built from ${{ steps.tag.outputs.tag_name }} plus $(git rev-list --count "${{ steps.tag.outputs.tag_name }}"..HEAD) fork commits."

      - name: Create or update fork tag
        run: |
          git tag -f ${{ steps.tag.outputs.fork_tag }}
          git push origin ${{ steps.tag.outputs.fork_tag }} --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # A debug build cannot be installed over a previous release build - the signature
      # differs - so every update would mean uninstalling and syncing again. Signing with
      # an own key keeps the fork releases updatable among themselves.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set. Signing needs two repository secrets"
            echo "(ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD) and one variable"
            echo "(ANDROID_KEY_ALIAS)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build OSE Release APK
        run: ./gradlew app:assembleOseRelease
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # PKCS12 keeps store and key under the same password, and build.gradle.kts asks for
          # both - one secret feeds both rather than two that must be kept identical.
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          CROWDIN_API_KEY: ${{ secrets.CROWDIN_API_KEY }}
          GOOGLE_GEO_API_KEY: ${{ secrets.GOOGLE_GEO_API_KEY }}
          GH_CONTRIBUTORS_API_KEY: ${{ secrets.GH_CONTRIBUTORS_API_KEY }}

      - name: Copy OSE APK
        run: cp app/build/outputs/apk/ose/release/app-ose-release.apk jtxBoard-${{ steps.tag.outputs.fork_tag }}.apk

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Create or update Github Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.fork_tag }}
          name: "jtxBoard ${{ steps.tag.outputs.fork_tag }}"
          body: |
            Fork build based on upstream ${{ steps.tag.outputs.tag_name }}, signed with the
            fork's own key - installable over an earlier fork release, not over the official app.

            Contains: the recurrence window as a setting (see #1660).

            Build triggered: ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Automatic (new tag)' }}
          prerelease: ${{ contains(steps.tag.outputs.tag_name, '-alpha') || contains(steps.tag.outputs.tag_name, '-beta') || contains(steps.tag.outputs.tag_name, '-rc') }}
          files: jtxBoard-${{ steps.tag.outputs.fork_tag }}.apk
          generate_release_notes: false
          fail_on_unmatched_files: true
