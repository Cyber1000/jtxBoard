name: Fork - Build APK

# Baut ein installierbares APK aus einem beliebigen Ref und legt es als
# Build-Artefakt ab. Kein Tag, kein Release, kein Merge - fuer einen Test
# braucht man nur die Datei. Nutzt ausschliesslich Actions von GitHub bzw.
# verifizierte, damit die Allow-List des Repos nicht im Weg steht.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, Tag oder Commit, aus dem gebaut wird"
        required: true
        type: string
        default: develop-fork

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build OSE debug APK
        run: ./gradlew app:assembleOseDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jtxBoard-ose-debug
          path: app/build/outputs/apk/ose/debug/app-ose-debug.apk
          if-no-files-found: error
