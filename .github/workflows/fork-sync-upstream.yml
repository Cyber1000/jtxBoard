name: Fork - Sync upstream

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop-fork
        uses: actions/checkout@v5
        with:
          ref: develop-fork
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/techbeeAT/jtxBoard.git || true
          git fetch upstream --tags

      - name: Sync develop branch (clean)
        run: |
          git checkout develop || git checkout -b develop upstream/develop
          git reset --hard upstream/develop
          git push origin develop --force

      - name: Disable original workflows in develop
        run: |
          git checkout develop

          # rename workflows, not starting with "fork-"
          cd .github/workflows
          for file in *.yml *.yaml; do
            [ -e "$file" ] || continue
            
            # rename only workflows, not starting with "fork-"
            if [[ ! "$file" =~ ^fork- ]] && [[ ! "$file" =~ \.disabled$ ]]; then
              git mv "$file" "${file}.disabled" 2>/dev/null || true
            fi
          done

          git add .
          git commit -m "Disable non-fork workflows after upstream sync" || true
          git push origin develop

      - name: Rebase develop-fork on develop
        id: rebase
        run: |
          git checkout develop-fork
          # Ein Rebase, der auf eine Hand wartet, ist in einem naechtlichen Job ein
          # Dauerfehler: er laesst den Baum halb fertig stehen und der naechste Lauf
          # scheitert an denselben Konflikten. Also sauber abbrechen und melden.
          if ! git rebase develop; then
            git rebase --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          git push origin develop-fork --force-with-lease

      - name: Report conflict as an issue
        if: failure() && steps.rebase.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          # Ein roter Cron-Lauf faellt niemandem auf, ein Issue schon - genau daran
          # ist dieser Sync monatelang unbemerkt gescheitert.
          title="Fork sync: rebase of develop-fork onto upstream failed"
          if [ -z "$(gh issue list --state open --search "$title" --json number --jq '.[0].number')" ]; then
            body="The nightly sync could not rebase develop-fork onto develop. The rebase was aborted, so the branch is untouched. Resolve the conflict locally and push, then the next run continues on its own."
            body="$body Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue create --title "$title" --body "$body"
          fi

      - name: Sync all tags
        run: |
          git push origin --tags --force
